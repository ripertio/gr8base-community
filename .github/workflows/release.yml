name: Release

# Closing a milestone creates the tag + GitHub release with auto-generated notes.
#
# The version is taken from the milestone description (a line like
# "version: 0.6.0"), so the title can stay human-readable. If there is no such
# line, the title is used when it is itself a version ("0.6.0" / "v0.6.0").
# Milestones with neither are ignored.

on:
  milestone:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release from milestone
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_TITLE: ${{ github.event.milestone.title }}
          MILESTONE_DESC: ${{ github.event.milestone.description }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SEMVER='v?[0-9]+\.[0-9]+\.[0-9]+'
          VERSION=""

          # 1. "version: 0.6.0" line in the description
          if [[ "$MILESTONE_DESC" =~ (^|[[:space:]])[Vv]ersion:[[:space:]]*($SEMVER) ]]; then
            VERSION="${BASH_REMATCH[2]}"
          # 2. title is itself a version
          elif [[ "$MILESTONE_TITLE" =~ ^$SEMVER$ ]]; then
            VERSION="$MILESTONE_TITLE"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "No version found in milestone '$MILESTONE_TITLE', skipping."
            exit 0
          fi

          TAG="v${VERSION#v}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          if [[ "$MILESTONE_TITLE" == "$VERSION" || "$MILESTONE_TITLE" == "$TAG" ]]; then
            RELEASE_TITLE="$TAG"
          else
            RELEASE_TITLE="$TAG – $MILESTONE_TITLE"
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$DEFAULT_BRANCH" \
            --title "$RELEASE_TITLE" \
            --generate-notes
