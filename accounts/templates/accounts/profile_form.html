{% extends "base.html" %}

{% block title %}Edit profile – gr8base community{% endblock %}

{% block content %}
    <h1>Edit profile</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'profiles:detail' user.username %}">Cancel</a>
    </form>
{% endblock %}
