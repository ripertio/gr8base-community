{% extends "admin/base_site.html" %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>Return these crags to their submitters. The reason is shown to them.</p>
    <ul>
        {% for crag in crags %}
            <li>{{ crag.name }}
                <input type="hidden" name="{{ action_checkbox_name }}" value="{{ crag.pk }}">
            </li>
        {% endfor %}
    </ul>
    {{ form.as_p }}
    <input type="hidden" name="action" value="return_to_submitter">
    <input type="hidden" name="apply" value="1">
    <input type="submit" value="Return to submitter">
    <a href="{% url 'admin:crags_crag_changelist' %}">Cancel</a>
</form>
{% endblock %}
