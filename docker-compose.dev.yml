# Development setup: Django runserver with live reload + Postgres.
# No Caddy, no Cloudflare tunnel -> app is reachable at http://localhost:8010 (host port: WEB_PORT)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml up --watch      # also rebuilds when requirements change
#
# Handy commands:
#   docker compose -f docker-compose.dev.yml exec web python manage.py makemigrations
#   docker compose -f docker-compose.dev.yml exec web python manage.py createsuperuser
#   docker compose -f docker-compose.dev.yml exec web python manage.py test
#   docker compose -f docker-compose.dev.yml exec db psql -U familienfelsen familienfelsen
#   docker compose -f docker-compose.dev.yml down -v          # wipe dev DB and start fresh
#
# Tip: `export COMPOSE_FILE=docker-compose.dev.yml` saves you the -f flag.

name: gr8base-dev   # separate project name -> never collides with prod containers/volumes

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-only-insecure-key-do-not-use-in-prod
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${WEB_PORT:-8010},http://127.0.0.1:${WEB_PORT:-8010}
      RESEND_API_KEY: ${RESEND_API_KEY:-}


      POSTGRES_DB: familienfelsen
      POSTGRES_USER: familienfelsen
      POSTGRES_PASSWORD: dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      PYTHONUNBUFFERED: "1"   # logs show up immediately
    ports:
      - "${WEB_PORT:-8010}:8000"   # host port; 8000 clashed with an editor port-forward
    volumes:
      - .:/app                      # live code reload
      - ${MEDIA_DIR:-./data-dev/media}:/app/media # dev uploads, separate from prod data
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true   # allows `docker attach` for pdb / breakpoint()
    tty: true
    develop:
      watch:
        # Rebuild the image when dependencies change (used with `up --watch`)
        - action: rebuild
          path: requirements.txt

  db:
    image: postgres:17   # same major version as prod
    environment:
      POSTGRES_DB: familienfelsen
      POSTGRES_USER: familienfelsen
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"   # reachable from host (DBeaver, psql, ...), localhost only
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familienfelsen -d familienfelsen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev: