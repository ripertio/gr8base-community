{% extends "base.html" %}


{% block title %}
FAQ – gr8base community
{% endblock %}


{% block content %}




{% if intro %}
<section>
    {{ intro|safe }}
</section>
{% endif %}


<section>

    <h2>
        Useful information
    </h2>

    <ul>
        {% for page in pages %}
        <li><a href="{% url 'doc_page' page.slug %}">{{ page.title }}</a></li>
        {% endfor %}
        <li><a href="{% url 'stats:index' %}">Site statistics</a></li>
    </ul>

</section>



{% endblock %}
